# Render Blueprint — https://render.com/docs/blueprint-spec
# Render 대시보드에서 "New" -> "Blueprint"로 이 저장소를 선택하면 아래 설정을
# 그대로 읽어 무료(Free) 웹 서비스로 배포를 준비한다. sync: false인 값들은
# Render가 자동으로 채우지 않으므로, 배포 전에 Render 대시보드의 환경변수
# 화면에서 직접 입력해야 한다 (Aiven MySQL 접속 정보 / Groq / NewsData.io / KMA 키).
services:
  - type: web
    name: daily-news-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false
      - key: KMA_SERVICE_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USE_TLS
        value: "true"
