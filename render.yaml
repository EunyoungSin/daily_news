# Render Blueprint — https://render.com/docs/blueprint-spec
# Render 대시보드에서 "New" -> "Blueprint"로 이 저장소를 선택하면 아래 설정을
# 그대로 읽어 무료(Free) 웹 서비스로 배포를 준비한다. sync: false인 값들은
# Render가 자동으로 채우지 않으므로, 배포 전에 Render 대시보드의 환경변수
# 화면에서 직접 입력해야 한다 (Aiven MySQL 접속 정보 / Groq / NewsData.io / KMA 키).
services:
  - type: web
    name: daily-news-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # /healthz는 DB/외부 API를 전혀 건드리지 않고 즉시 200을 반환하므로,
    # Render가 "프로세스가 요청을 받을 수 있는지"만으로 헬스체크를 판단하게
    # 한다 — dhlottery/Groq/NewsData.io 장애가 헬스체크 실패로 오인되어
    # 불필요한 재시작이 도는 것을 막는다.
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false
      - key: KMA_SERVICE_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USE_TLS
        value: "true"
      # dhlottery가 차단되어 있는 등 로또 수집 자체가 문제를 일으킬 때,
      # 코드 재배포 없이 Render 대시보드에서 바로 "false"로 바꿔 로또
      # 섹션/백그라운드 수집을 완전히 멈출 수 있다. sync: false라서 여기
      # 값은 초기 생성 시에만 참고되고, 이후에는 대시보드에서 직접 관리한다.
      - key: LOTTO_ENABLED
        sync: false
